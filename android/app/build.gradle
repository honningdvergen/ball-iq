apply plugin: 'com.android.application'

// Release signing — read from key.properties (git-ignored). If absent (fresh checkout / CI),
// release stays unsigned/debug so the build doesn't hard-fail; only real releases need this file.
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "app.balliq"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.balliq"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 71
        versionName "1.8.8"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            // Play Console flags the app as unoptimized while this is false.
            // See proguard-rules.pro — Capacitor registers all 17 plugins by
            // reflection, so R8 needs explicit keep rules or it strips them and
            // the build STILL goes green; the breakage is runtime-only.
            minifyEnabled true
            // Left off deliberately. The AAB is dominated by the web bundle in
            // assets/ and the native libs, neither of which resource shrinking
            // touches, so it would add a way for res/ to go missing in exchange
            // for almost no size win.
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// ⚠️ A BUILD WITHOUT google-services.json CRASHES ON LAUNCH (22 Nov 2026).
//
// This block used to skip the Firebase plugin quietly when the file was
// missing ("Push Notifications won't work"). It is worse than that: with no
// Firebase configuration in the app, PushNotifications.register() throws
// inside Capacitor's bridge thread and takes the whole process down, and the
// app calls register() on every launch for a player who has allowed
// notifications. Versions 63 (1.8.6, live from 13 Nov) to 69 were built in the
// release clone, where this git-ignored file did not exist: Play recorded
// about a hundred crashes from eleven players in nine days, and one of them
// wrote in ("it started crashing when I open the app").
//
// So a release build without the file is now refused outright. A debug build
// may still go without it (it warns), because a debug build never ships.
def servicesJSON = file('google-services.json')
def hasServices = servicesJSON.exists() && servicesJSON.text.trim().length() > 0
if (hasServices) {
    apply plugin: 'com.google.gms.google-services'
} else {
    def wanted = gradle.startParameter.taskNames.collect { it.toLowerCase() }
    if (wanted.any { it.contains('release') || it.contains('bundle') }) {
        throw new GradleException("android/app/google-services.json is missing. A release built without it crashes on launch for every player who has allowed notifications. Copy the file in (see ~/ball-iq-release/android-secrets/) and build again.")
    }
    logger.warn("google-services.json not found: this DEBUG build has no Firebase, and PushNotifications.register() will crash it.")
}
