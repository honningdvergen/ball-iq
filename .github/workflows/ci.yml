# Ball IQ CI — first safety net (2026-07-14).
#
# Job 1 (build-and-unit) is the hard gate: it mirrors the local
# `npm run build` pipeline (eslint gate, vite build, SEO page gen) plus the
# vitest unit suite. No secrets needed — the Sentry vite plugin self-disables
# when SENTRY_AUTH_TOKEN is unset.
#
# Job 2 (e2e) runs the Playwright suite against a local vite server
# (playwright.config.js webServer). It is now a REAL GATE — continue-on-error
# came off 2026-08-21 after the two stale tests behind 30 consecutive silent
# failures were fixed and the run was scoped to fit its own timeout.
# The original worry still stands and is worth restating: a red-from-day-one
# gate just teaches people to ignore CI. So if this job starts failing for
# reasons nobody intends to fix, FIX IT OR DELETE IT — do not reach for
# continue-on-error again. That is what produced a green tick that meant
# nothing for a month.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  # ⚠️ RE-RUN BY HAND. On 2026-08-06/07 GitHub dropped runs entirely: two pushes
  # to main produced NO workflow run at all (not a failure — nothing), on top of
  # an evening of "The job was not acquired by Runner of type hosted". With only
  # push/pull_request triggers there was no way to get the safety net back
  # without inventing a commit, so a bank edit touching 65 questions sat
  # un-verified by CI. This makes re-running a button.
  #
  # Not a quota: the repo is PUBLIC, so Actions minutes are unlimited. That was
  # the tidy theory and it was wrong — check before believing it next time.
  workflow_dispatch:

jobs:
  build-and-unit:
    runs-on: ubuntu-latest
    # Bounded on purpose. This job takes ~1 minute; 15 leaves generous room
    # while guaranteeing it can never sit burning Actions minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (build gate — no-undef + rules-of-hooks are errors)
        run: npx eslint src --quiet

      - name: Build
        run: npx vite build

      - name: Generate SEO pages
        run: node scripts/gen-seo-pages.mjs

      - name: Unit tests
        run: npx vitest run

  e2e:
    runs-on: ubuntu-latest
    # ⚠️ ADDED 2026-08-06 after this job ran for FIVE HOURS TEN MINUTES before
    # failing — and had been doing 5-11 hours on every push for days. With no
    # timeout-minutes a job inherits GitHub's 6-hour default, and this config
    # uses workers:1 with retries:2, so one hung test blocks the queue serially
    # and then does it twice more.
    #
    # continue-on-error made it worse, not better: the run was never "failing"
    # in a way that demanded attention, it was just always yellow and always
    # slow, so nobody looked. A job that cannot fail loudly must at least be
    # unable to run forever.
    timeout-minutes: 20
    # ⚠️ continue-on-error was REMOVED 2026-08-21. It had been on since the job
    # was created, and the job failed on 30 CONSECUTIVE runs while GitHub
    # reported conclusion=success — so the only automated check on the
    # conversion path was off behind a green tick. Two stale tests were the
    # cause (a modal added to ProfileScreen that the test never dismissed, and
    # a hard-coded "of 2 played" that broke when the dailies went from 2 to 4).
    # Both fixed; full suite verified 429/429 locally before this line went.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # chromium covers the Galaxy/desktop projects, webkit the iPhone/iPad
      # ones (playwright device descriptors pick the engine per project).
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # ⚠️ The app throws "supabaseKey is required" at module scope when this
      # env var is missing, which black-screens EVERY route and made all
      # interactive e2e tests fail on every run (the key lives in the
      # git-ignored .env.local, which CI never had). This is a PUBLISHABLE
      # client key — it ships verbatim in the public JS bundle on balliq.app,
      # so embedding it here as a fallback leaks nothing. Set the
      # VITE_SUPABASE_KEY repo secret to override it (e.g. after a rotation).
      - name: Playwright e2e
        env:
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY || 'sb_publishable_FluGERu-3n3KSIlgM37Jbg_P0KhDsiR' }}
        # ⚠️ SCOPED, and this is why. The full matrix is 39 specs x 11 device
        # projects = 429 tests. Measured 2026-08-21: 10.9 min with parallel
        # workers locally, so SERIALISED at workers:1 it is comfortably past
        # the 15-minute globalTimeout in playwright.config.js — the suite
        # could never have gone green here no matter how correct the tests
        # were. Removing continue-on-error without this change would have
        # turned every push red on timeout, which is the "red-from-day-one
        # gate" this file's own header warns against.
        # Three projects cover what CI needs to catch: WebKit (iphone-14-pro),
        # Chromium mobile (galaxy-s22) and Chromium desktop (desktop-1280).
        # The other eight are viewport variants — run them locally with a bare
        # `npx playwright test` before a release, not on every push.
        run: npx playwright test --project=iphone-14-pro --project=galaxy-s22 --project=desktop-1280

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
