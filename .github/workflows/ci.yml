# Ball IQ CI — first safety net (2026-07-14).
#
# Job 1 (build-and-unit) is the hard gate: it mirrors the local
# `npm run build` pipeline (eslint gate, vite build, SEO page gen) plus the
# vitest unit suite. No secrets needed — the Sentry vite plugin self-disables
# when SENTRY_AUTH_TOKEN is unset.
#
# Job 2 (e2e) runs the Playwright suite against a local vite server
# (playwright.config.js webServer). It is continue-on-error FOR NOW — flip it
# strict once it has proven green in CI for a while; a red-from-day-one gate
# just teaches people to ignore CI.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  # ⚠️ RE-RUN BY HAND. On 2026-08-06/07 GitHub dropped runs entirely: two pushes
  # to main produced NO workflow run at all (not a failure — nothing), on top of
  # an evening of "The job was not acquired by Runner of type hosted". With only
  # push/pull_request triggers there was no way to get the safety net back
  # without inventing a commit, so a bank edit touching 65 questions sat
  # un-verified by CI. This makes re-running a button.
  #
  # Not a quota: the repo is PUBLIC, so Actions minutes are unlimited. That was
  # the tidy theory and it was wrong — check before believing it next time.
  workflow_dispatch:

jobs:
  build-and-unit:
    runs-on: ubuntu-latest
    # Bounded on purpose. This job takes ~1 minute; 15 leaves generous room
    # while guaranteeing it can never sit burning Actions minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (build gate — no-undef + rules-of-hooks are errors)
        run: npx eslint src --quiet

      - name: Build
        run: npx vite build

      - name: Generate SEO pages
        run: node scripts/gen-seo-pages.mjs

      - name: Unit tests
        run: npx vitest run

  e2e:
    runs-on: ubuntu-latest
    # ⚠️ ADDED 2026-08-06 after this job ran for FIVE HOURS TEN MINUTES before
    # failing — and had been doing 5-11 hours on every push for days. With no
    # timeout-minutes a job inherits GitHub's 6-hour default, and this config
    # uses workers:1 with retries:2, so one hung test blocks the queue serially
    # and then does it twice more.
    #
    # continue-on-error made it worse, not better: the run was never "failing"
    # in a way that demanded attention, it was just always yellow and always
    # slow, so nobody looked. A job that cannot fail loudly must at least be
    # unable to run forever.
    timeout-minutes: 20
    # Not yet a gate — see header comment. Flip to strict (remove this line)
    # once the suite has proven reliably green in CI.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # chromium covers the Galaxy/desktop projects, webkit the iPhone/iPad
      # ones (playwright device descriptors pick the engine per project).
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Playwright e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
