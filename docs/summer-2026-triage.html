<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --ground:#F5F7FA; --panel:#FFFFFF; --panel2:#EDF1F6; --line:#DCE3EB;
  --t1:#0F141A; --t2:#4C5765; --t3:#78838F;
  --ok:#1F8B3D; --no:#C3352C; --hold:#9A6B04; --accent:#3C8F02;
  --shadow:0 1px 2px rgba(15,20,26,.05),0 6px 18px -10px rgba(15,20,26,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0C0F14; --panel:#151A21; --panel2:#1D242D; --line:#242C36;
  --t1:#E8EDF3; --t2:#98A5B3; --t3:#6B7787;
  --ok:#46C35F; --no:#F2645A; --hold:#E3B341; --accent:#6FDB1F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --ground:#0C0F14; --panel:#151A21; --panel2:#1D242D; --line:#242C36;
  --t1:#E8EDF3; --t2:#98A5B3; --t3:#6B7787;
  --ok:#46C35F; --no:#F2645A; --hold:#E3B341; --accent:#6FDB1F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--t1);
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-bottom:64px}
h1,h2,.ui{font-family:"Inter Tight","Inter",sans-serif}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}

.bar{position:sticky;top:0;z-index:20;background:var(--panel);
  border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.bar-in{max-width:760px;margin:0 auto;padding:14px 18px 12px}
.ttl{font-family:"Inter Tight",sans-serif;font-size:17px;font-weight:700;letter-spacing:-.01em;margin:0}
.sub{font-size:12.5px;color:var(--t3);margin:2px 0 10px}
.track{height:6px;border-radius:99px;background:var(--panel2);overflow:hidden;display:flex}
.track i{display:block;height:100%}
.tallies{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;font-size:12.5px}
.tally{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;color:var(--t2)}
.tally b{font-weight:600}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.chip{font-family:"Inter Tight",sans-serif;font-size:12.5px;font-weight:600;padding:6px 11px;
  border-radius:99px;border:1px solid var(--line);background:var(--ground);color:var(--t2);
  cursor:pointer;-webkit-appearance:none;appearance:none;min-height:32px}
.chip[aria-pressed="true"]{background:var(--t1);color:var(--ground);border-color:var(--t1)}

main{max-width:760px;margin:0 auto;padding:18px}
.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid transparent;
  border-radius:14px;padding:16px 16px 14px;margin-bottom:14px;box-shadow:var(--shadow)}
.card[data-v="approve"]{border-left-color:var(--ok)}
.card[data-v="reject"]{border-left-color:var(--no);opacity:.72}
.card[data-v="hold"]{border-left-color:var(--hold)}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
.tag{font-family:"Inter Tight",sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);
  border-radius:6px;padding:3px 7px}
.dif{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--t3)}
.qid{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--t3)}
.qtext{font-size:16px;font-weight:600;line-height:1.45;margin:0 0 11px}
.opts{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:5px}
.opts li{font-size:14px;color:var(--t2);padding:7px 10px;border-radius:9px;background:var(--panel2)}
.opts li.right{color:var(--ok);font-weight:600;
  background:color-mix(in srgb,var(--ok) 13%,transparent);
  border:1px solid color-mix(in srgb,var(--ok) 40%,transparent)}
.why{font-size:13px;color:var(--t3);line-height:1.5;margin:0 0 13px;
  padding-left:10px;border-left:2px solid var(--line)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.act{font-family:"Inter Tight",sans-serif;font-size:14px;font-weight:700;min-height:46px;
  border-radius:11px;border:1px solid var(--line);background:var(--ground);color:var(--t2);
  cursor:pointer;-webkit-appearance:none;appearance:none;
  transition:transform .08s ease,background .12s ease,color .12s ease,border-color .12s ease}
.act:active{transform:scale(.97)}
.act[data-k="approve"][aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#04140A}
.act[data-k="reject"][aria-pressed="true"]{background:var(--no);border-color:var(--no);color:#1A0503}
.act[data-k="hold"][aria-pressed="true"]{background:var(--hold);border-color:var(--hold);color:#170F00}
.empty{text-align:center;color:var(--t3);padding:52px 16px;font-size:14.5px}
.legend{max-width:760px;margin:0 auto;padding:0 18px 4px;font-size:12.5px;color:var(--t3);line-height:1.7}
.legend b{color:var(--t2);font-weight:600}
.saving{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:30;
  font-family:"JetBrains Mono",monospace;font-size:11.5px;padding:7px 13px;border-radius:99px;
  background:var(--panel);border:1px solid var(--line);color:var(--t3);box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:opacity .2s ease}
.saving.on{opacity:1}
@media (max-width:520px){ .acts{grid-template-columns:1fr 1fr 1fr} .act{font-size:13px} }
</style>

<script type="application/json" id="state">{"decisions":{}}</script>
<script>
(() => {
  const QS = JSON.parse(document.getElementById('questions').textContent);
  const STATE = JSON.parse(document.getElementById('state').textContent);
  const decisions = STATE.decisions || {};
  const app = document.getElementById('app');
  const savingEl = document.getElementById('saving');
  let filter = 'todo';

  const VERDICTS = [['approve','Approve'],['reject','Reject'],['hold','Hold']];
  const counts = () => {
    const c = { approve:0, reject:0, hold:0, todo:0 };
    for (const q of QS) { const v = decisions[q.id]; if (v && c[v] !== undefined) c[v]++; else c.todo++; }
    return c;
  };

  function renderHeader() {
    const c = counts();
    const pct = (n) => (n / QS.length * 100).toFixed(2) + '%';
    document.getElementById('track').innerHTML =
      '<i style="width:' + pct(c.approve) + ';background:var(--ok)"></i>' +
      '<i style="width:' + pct(c.reject) + ';background:var(--no)"></i>' +
      '<i style="width:' + pct(c.hold)  + ';background:var(--hold)"></i>';
    document.getElementById('tallies').innerHTML =
      '<span class="tally"><b style="color:var(--ok)">' + c.approve + '</b> approved</span>' +
      '<span class="tally"><b style="color:var(--no)">' + c.reject + '</b> rejected</span>' +
      '<span class="tally"><b style="color:var(--hold)">' + c.hold + '</b> held</span>' +
      '<span class="tally"><b>' + c.todo + '</b> left</span>';
    const opts = [['todo','Left to do'],['all','All'],['approve','Approved'],['reject','Rejected'],['hold','Held']];
    document.getElementById('filters').innerHTML = opts.map(([k,label]) =>
      '<button class="chip" data-f="' + k + '" aria-pressed="' + (filter===k) + '">' + label + '</button>').join('');
  }

  const esc = (s) => String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  function visible() {
    if (filter === 'all') return QS;
    if (filter === 'todo') return QS.filter(q => !decisions[q.id]);
    return QS.filter(q => decisions[q.id] === filter);
  }

  function renderList() {
    const rows = visible();
    if (!rows.length) {
      app.innerHTML = '<p class="empty">Nothing here.' +
        (filter === 'todo' ? '<br>All 89 have a verdict &mdash; tell Claude and it will apply them.' : '') + '</p>';
      return;
    }
    app.innerHTML = rows.map(q => {
      const v = decisions[q.id] || '';
      return '<article class="card"' + (v ? ' data-v="' + v + '"' : '') + '>' +
        '<div class="meta"><span class="tag">' + esc(q.c) + '</span>' +
        '<span class="dif">' + esc(q.d) + '</span>' +
        (q.k ? '<span class="dif">&middot; ' + esc(q.k) + '</span>' : '') +
        '<span class="qid">' + esc(q.id) + '</span></div>' +
        '<p class="qtext">' + esc(q.q) + '</p>' +
        '<ul class="opts">' + q.o.map((o,i) =>
          '<li class="' + (i === q.a ? 'right' : '') + '">' + esc(o) + '</li>').join('') + '</ul>' +
        (q.h ? '<p class="why">' + esc(q.h) + '</p>' : '') +
        '<div class="acts">' + VERDICTS.map(([k,label]) =>
          '<button class="act" data-k="' + k + '" data-id="' + q.id + '" aria-pressed="' + (v===k) + '">' +
          label + '</button>').join('') + '</div>' +
      '</article>';
    }).join('');
  }

  function render() { renderHeader(); renderList(); }

  /* ── persistence ───────────────────────────────────────────────────────
     The page IS the record: decisions are published back into this document
     so they survive a reload and Claude can read them straight off the URL.
     Publishes the SHELL plus state, never the rendered list — #app is emptied
     in the clone, so nothing runtime-generated is baked into the saved copy. */
  let artifact = null, timer = null, dirty = false;
  // ⚠️ `claude` only exists inside the artifact host. Referencing it bare threw
  // a ReferenceError outside it and killed this whole IIFE before render() ran,
  // so the page came up blank when served anywhere else. Branch on absence.
  try {
    if (typeof claude !== 'undefined' && claude && typeof claude.use === 'function') {
      claude.use('artifact').then(a => { artifact = a; }).catch(() => {});
    }
  } catch (_) { /* no host: the page still works, it just cannot save */ }

  function flash(msg) {
    savingEl.textContent = msg;
    savingEl.classList.add('on');
    clearTimeout(flash._t);
    flash._t = setTimeout(() => savingEl.classList.remove('on'), 1400);
  }

  async function publish() {
    if (!artifact) { flash('not saved \u2014 read-only'); return; }
    dirty = false;
    try {
      const clone = document.documentElement.cloneNode(true);
      clone.querySelector('#app').innerHTML = '';
      clone.querySelector('#state').textContent = JSON.stringify({ decisions });
      await artifact.publish('<!doctype html>\n' + clone.outerHTML);
      flash('saved \u00b7 ' + Object.keys(decisions).length + '/' + QS.length);
    } catch (e) {
      // conflict is routine — another view won; no retry, it will reload.
      if (!(e && e.code === 'conflict')) flash('not saved');
    }
  }

  function queuePublish() {
    dirty = true;
    clearTimeout(timer);
    timer = setTimeout(() => { if (dirty) publish(); }, 1100);
  }

  document.addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (chip) { filter = chip.dataset.f; render(); window.scrollTo({ top: 0 }); return; }
    const act = e.target.closest('.act');
    if (!act) return;
    const id = act.dataset.id, k = act.dataset.k;
    if (decisions[id] === k) delete decisions[id]; else decisions[id] = k;
    render();
    queuePublish();
  });

  // Don't lose the last taps if the tab closes inside the debounce window.
  window.addEventListener('pagehide', () => { if (dirty) publish(); });

  render();
})();
</script>
