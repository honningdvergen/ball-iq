<!doctype html>
<html><head><meta charset="utf-8">
<style>
  /* 1080x1920. Safe zone for Shorts UI: x 60–960, y 260–1480 (09-23 viral spec). Nothing important outside it. */
  :root { --accent:#ef3340; --g1:#3a1216; --g2:#110a0c; --opt:#170f11; --line:#2b1a1d; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { width:1080px; height:1920px; overflow:hidden; background:#07090d; color:#fff; font-family:-apple-system,'SF Pro Display','Helvetica Neue',Arial,sans-serif; }
  #wrap { position:absolute; inset:0; }
  #bg { position:absolute; inset:0; background:radial-gradient(130% 70% at 50% 20%, var(--g1) 0%, var(--g2) 55%, #06080c 100%); }
  #tag { position:absolute; left:60px; width:900px; top:290px; font-size:52px; line-height:1.08; font-weight:900; letter-spacing:.01em; color:var(--accent); text-transform:uppercase; }
  #q { position:absolute; left:60px; width:900px; top:470px; font-size:84px; line-height:1.08; font-weight:850; letter-spacing:-.015em; }
  #opts { position:absolute; left:60px; width:900px; top:940px; display:flex; flex-direction:column; gap:18px; }
  #opts.grid { display:grid; grid-template-columns:1fr 1fr; }
  .o { background:var(--opt); border:4px solid var(--line); border-radius:26px; padding:18px 28px; font-size:58px; font-weight:800; display:flex; align-items:center; gap:22px; line-height:1.05; }
  .o i { font-style:normal; flex:none; width:64px; height:64px; border-radius:16px; background:rgba(255,255,255,.1); display:flex; align-items:center; justify-content:center; font-size:40px; color:rgba(255,255,255,.75); }
  .o.right { background:#0b3d22; border-color:#22c55e; } .o.right i { background:#22c55e; color:#000; }
  .o.wrong { background:#3a0d0d; border-color:#7f1d1d; opacity:.55; }
  #bar { position:absolute; left:60px; width:900px; top:1460px; height:22px; border-radius:11px; background:rgba(255,255,255,.1); overflow:hidden; }
  #fill { height:100%; width:100%; background:#fff; border-radius:11px; }
  #banter { position:absolute; left:60px; width:900px; top:262px; font-size:56px; font-weight:900; line-height:1.1; text-align:center; display:none;
            background:#fff; color:#000; padding:22px 26px; border-radius:22px; transform:rotate(-2deg); }
  #handle { position:absolute; left:60px; top:1400px; font-size:30px; font-weight:700; color:rgba(255,255,255,.45); letter-spacing:.06em; }
</style></head>
<body>
<div id="bg"></div>
<div id="wrap"><div id="tag"></div>
<div id="q"></div>
<div id="opts"></div>
<div id="bar"><div id="fill"></div></div>
<div id="banter"></div></div>
<script>
const $ = (id) => document.getElementById(id);
const L = ['A', 'B', 'C', 'D'];
window.setup = (d) => {
  const r = document.documentElement.style; for (const [k, v] of Object.entries(d.palette)) r.setProperty('--' + k, v);
  $('tag').textContent = d.tag; $('q').textContent = d.q; 
  $('opts').className = d.grid ? 'grid' : '';
  $('opts').replaceChildren(...d.o.map((t, i) => { const e = document.createElement('div'); e.className = 'o'; e.id = 'o' + i; const b = document.createElement('i'); b.textContent = L[i]; e.append(b, document.createTextNode(t)); return e; }));
  // fit: question ≤ 3 lines inside y 470–900; options inside y 940–1440
  // Fit: options sit 44px under the question; shrink the QUESTION first (it has room), options only if still needed.
  const q = $('q'), box = $('opts');
  const place = () => { box.style.top = (q.getBoundingClientRect().bottom + 44) + 'px'; return box.getBoundingClientRect().bottom; };
  for (let fs = 84; (q.getBoundingClientRect().bottom > 900 || place() > 1420) && fs > 56; fs -= 3) q.style.fontSize = fs + 'px';
  for (let fs = 58; place() > 1420 && fs > 40; fs -= 2) document.querySelectorAll('.o').forEach((e) => { e.style.fontSize = fs + 'px'; });
  // centre the whole block in the visible band (above the 1460 timer), never above the 260 UI line
  const top = $('tag').getBoundingClientRect().top, bottom = place();
  $('wrap').style.transform = `translateY(${Math.max(0, Math.round((1420 - bottom) / 2 - Math.max(0, 0)))}px)`;
  window.D = d;
};
// t in seconds: 0–9 timer drains, 9 reveal, 9.8 banter
window.at = (t) => {
  const d = window.D;
  $('fill').style.width = Math.max(0, 1 - t / d.think) * 100 + '%';
  $('fill').style.background = d.think - t <= 3 ? '#ff4d4d' : '#ffffff';
  const rev = t >= d.think;
  d.o.forEach((_, i) => { $('o' + i).className = 'o' + (rev ? (i === d.a ? ' right' : ' wrong') : ''); });
  $('bar').style.visibility = rev ? 'hidden' : 'visible';
  const b = $('banter'); b.textContent = d.banter; const on = t >= d.think + 0.8; b.style.display = on ? 'block' : 'none'; $('tag').style.visibility = on ? 'hidden' : 'visible';
};
window.ready = true;
</script>
</body></html>
